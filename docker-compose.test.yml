services:
  tests:
    platform: linux/amd64
    build:
      context: .
    command: pytest -v
    environment:
      - PYTHONPATH=/app/api
      - DJANGO_SETTINGS_MODULE=config.settings
    volumes:
      - ./api:/app/api
    networks:
      - compoundmanager
    depends_on:
      - db

  db:
    image: postgres
    platform: linux/amd64
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - compoundmanager

networks:
  compoundmanager: